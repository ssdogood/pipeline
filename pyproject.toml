[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpl"
version = "0.3.0"
description = "Data pipeline: Oracle/AD extraction to staging, parquet and DuckLake"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=2.0.0",
    "oracledb>=2.0.0",
    "polars>=2.0.0",
    # RUNTIME-TRANSITIVE, not directly imported anywhere: DuckDB's
    # replacement scan (polars DataFrame -> Arrow in write_parquet.py)
    # requires pyarrow at execution time. Invisible to import scans -
    # proven 2026-11-07: fresh env without it fails 16 writer tests.
    # DO NOT remove.
    "pyarrow>=18.0.0",
    "pyyaml>=6.0",
    "schema>=0.7.0",
    "ldap3>=2.9.0",
    # TRANSITIVE SECURITY FLOOR, not directly imported: pyasn1 arrives
    # via ldap3 (BER-decodes every LDAP response). CVE-2026-119194
    # (quadratic CPU in schemaless DER decoding) is fixed in 0.6.5;
    # floored 2026-11-07 so resolvers can never serve an older one.
    "pyasn1>=0.6.5",
    "cryptography>=50.0.0",
    # roadmap (connector "postgres" via lib/connectors.py): not yet
    # imported anywhere - kept deliberately, same policy as before
    "psycopg[binary]>=3.0.0",
]

[project.optional-dependencies]
# Receivers that will certify (i.e. everyone, normally) need pytest:
test = ["pytest>=9.0.0"]
# Developers add the linter:
dev = [
    "dpl[test]", 
    "ruff>=0.1.0", 
    "pyrefly", 
    "types-PyYAML", 
    "types-ldap3",
    "pytest-cov",
    "pyright[nodejs]==1.1.414"
]

[project.scripts]
dpl = "dpl.cli:main"
dpl-run = "dpl.cli:run_shim"
dpl-update-history = "dpl.cli:update_history_shim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpl = ["*.yaml", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches live systems (Oracle/AD) with real vault credentials; run deliberately via 'pytest -m integration'",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",
]

[tool.ruff.lint]
ignore = [
    # TRY004: ValueError is deliberate here (wrapper incident 2026-11-05,
    # documented in the code comment above the raise)
    "TRY004",
    # RUF022: __all__ is intentionally grouped (facade first, then errors)
    "RUF022",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pyright]
pythonVersion = "3.11.18"
include = ["config", "demo", "scripts", "src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
typeCheckingMode = "standard"
reportMissingImports = "warning"

# PT-032/015: new modules are born STRICT (ratchet convention agreed
# 2026-11-25 - global mode stays standard; existing code migrates
# package-by-package later, after higher-priority modules rest).
# Add each new pure module here as it is created (B1: schedule.py).
# NOTE: per-environment typeCheckingMode is NOT supported by pyright
# (executionEnvironments only takes root/paths/version/platform);
# the top-level `strict` path list is the sanctioned per-file ratchet.
strict = [
    "src/dpl/lib/schedule.py", "tests/unit/test_schedule.py"
]