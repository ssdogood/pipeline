[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpl"
version = "0.1.1"
description = "Data pipeline: Oracle/AD extraction to staging, parquet and DuckLake"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.0.0",
    "oracledb>=2.0.0",
    "polars>=2.0.0",
    # RUNTIME-TRANSITIVE, not directly imported anywhere: DuckDB's
    # replacement scan (polars DataFrame -> Arrow in write_parquet.py)
    # requires pyarrow at execution time. Invisible to import scans -
    # proven 2026-11-07: fresh env without it fails 16 writer tests.
    # DO NOT remove.
    "pyarrow>=18.0.0",
    "pyyaml>=6.0",
    "schema>=0.7.0",
    "ldap3>=2.9.0",
    # TRANSITIVE SECURITY FLOOR, not directly imported: pyasn1 arrives
    # via ldap3 (BER-decodes every LDAP response). CVE-2026-119194
    # (quadratic CPU in schemaless DER decoding) is fixed in 0.6.5;
    # floored 2026-11-07 so resolvers can never serve an older one.
    "pyasn1>=0.6.5",
    "cryptography>=50.0.0",
    # roadmap (connector "postgres" via lib/connectors.py): not yet
    # imported anywhere - kept deliberately, same policy as before
    "psycopg[binary]>=3.0.0",
]

[project.optional-dependencies]
# Receivers that will certify (i.e. everyone, normally) need pytest:
test = ["pytest>=9.0.0"]
# Developers add the linter:
dev = [
    "dpl[test]", 
    "ruff>=0.1.0", 
    "pyrefly", 
    "types-PyYAML", 
    "types-ldap3",
    "pytest-cov"
]

[project.scripts]
dpl-run = "dpl.wrapper.run:main"
dpl-update-history = "dpl.wrapper.update_history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpl = ["*.yaml", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches live systems (Oracle/AD) with real vault credentials; run deliberately via 'pytest -m integration'",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",
]

[tool.ruff.lint]
ignore = [
    # TRY004: ValueError is deliberate here (wrapper incident 2026-11-05,
    # documented in the code comment above the raise)
    "TRY004",
    # RUF022: __all__ is intentionally grouped (facade first, then errors)
    "RUF022",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
