name: dpl
channels:
  - conda-forge
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - python=3.11
  - pip>=24.0
  - setuptools>=68.0
  # Conda-native packages (prefer when available)
  - duckdb
  - oracledb
  - polars
  - pandas
  - pyarrow
  - psycopg2-binary
  - pyyaml
  - schema
  - ldap3
  - pytest
  # Anything else stays in requirements.txt
  - pip:
      - -e .
      - tenacity>=9.0.0
      - authlib>=1.6.0
      - expiringdict>=1.2.0
      - jinja2>=3.0.0
      - cryptography>=50.0.0
      - pydantic>=2.0.0
      - orjson>=3.9.0
      - pyodbc>=5.0.0
      - ruff>=0.1.0
      - types-PyYAML>=6.0.0
      - types-ldap3>=2.9
#prefix: D:\Applications\mc3\envs\dpl