name: dpl
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
# SINGLE OWNER RULE: this file provides the INTERPRETER. pyproject.toml
# owns every Python package (installed by pip install .). Never list a
# Python package here - two lists drift; one list cannot.
#
# SETUP:
#   conda env create -f environment.yml && conda activate dpl
#   Developers:          python -m pip install -e ".[dev]"
#   Bundle receivers:    pip install ".[test]"
# OLDER CPUs: if polars aborts (0xc000001d) or warns about missing
#   CPU features, once per machine: pip install polars-lts-cpu