version: 1
default_method: fernet

methods:
  sops:
    binary: bin/sops-v3.13.3.darwin.arm64
    manifest: bin/sops_manifest.txt
    age_key_file: ~/.dpl-keys/laptop/sops-age/age.key
    encrypted_file: secrets/secrets.sops.yaml
  fernet:
    key_file: /Users/mbp/.dpl-keys/laptop/fernet/key
    encrypted_file: secrets/secrets.fernet.bin

secrets:
  ora_db.user_name.password: {}
  ad_atm.subd\support.password: {}
  ad_main.subd\support.password: {}