# ==============================================================================
# GLOBAL RUNTIME & WRITER SETTINGS
# ------------------------------------------------------------------------------
# This file is shared by ALL source configs (config.yaml etc.) and by every
# extractor (oracle now; postgres etc. later). It is the single home for
# machine/environment-specific tuning. The per-connection identities, secrets
# and table lists live in config.yaml - NEVER here.
#
# DESIGN RULES for this file:
#   1. Environment-specific (Windows laptop vs Linux server): copy this file
#      per environment (e.g. settings.laptop.yaml / settings.server.yaml) and
#      pass the desired path to the pipeline. Only paths should ever need to
#      differ; tuning values may also be adjusted per machine.
#   2. Validated at startup by lib.common.SETTINGS_SCHEMA. A missing
#      mandatory key or a malformed value fails the run loudly before any
#      connection is opened.
#   3. Unknown keys are tolerated (future-proofing), but misspelled versions
#      of KNOWN keys are silently ignored - if a setting appears not to take
#      effect, check spelling here first.
# ==============================================================================

# ------------------------------------------------------------------------------
# PASS_MGR (vault-backed credentials)
#
#   environment : which pass_mgr.<environment>.yaml the vault layer reads
#                 at runtime (its default_method picks fernet or sops).
#                 Passwords are NEVER read from files in secrets/ anymore.
# ------------------------------------------------------------------------------
pass_mgr:
  environment: laptop

# ------------------------------------------------------------------------------
# POLARS / FETCH BATCHING
#
# Controls how many rows flow through the pipeline per chunk:
#   - Oracle fetch: sets oracledb arraysize AND prefetchrows (round-trip
#     reduction - the single biggest throughput lever for extraction)
#   - Polars: rows per interim DataFrame handed to DuckDB staging
#
# Memory implications:
#   Polars has NO true memory cap. batch_rows is the practical control:
#   50k rows x ~10 columns is tens of MB per batch in flight - comfortably
#   within a 4GB Polars budget. Larger values = faster fetch, more RAM;
#   halve it if you see memory pressure on wide tables.
#
# Optional key (schema default: 50000 if omitted). Must be a positive integer.
# ------------------------------------------------------------------------------
polars:
  batch_rows: 50000

  # strict_cast: true (default) - a value that does not fit its declared
  # dtype (from schema_master_*.csv) fails that table LOUDLY. Flip to
  # false only as an emergency valve: Polars then silently coerces
  # (e.g. decimal truncation on a widened NUMBER column). Any run using
  # false is logged with its effective value.
  strict_cast: true


# ------------------------------------------------------------------------------
# FILESYSTEM PATHS (REQUIRED - the only mandatory section besides duckdb.memory_limit)
#
#   landing_root : final published data. Layout created under it:
#                     <landing_root>/<YYYY-MM-DD>/<connection.folder>/<table>/
#                     plus per-folder manifests at <landing_root>/<date>/
#                     _manifest_<folder>.json
#                 Retention managed by prune_old_landing (retention is
#                 configured at the wrapper level, not here).
#
#   scratch_root : transient working area. Two jobs depend on it:
#                     1. DuckDB spill (temp files beyond memory_limit -
#                        this is what bounds RAM for arbitrarily large tables)
#                     2. Staging of Parquet parts before the atomic move
#                        into landing
#
#   IMPORTANT: scratch_root MUST be on the SAME filesystem/volume as
#   landing_root - the atomic publish (move/rename) only works within one
#   filesystem. If they are on different volumes, publication degrades to
#   copy-then-delete and loses its atomicity guarantee.
#
#   Windows note: use forward slashes or doubled backslashes
#   (D:/data/landing or D:\\data\\landing), NOT single backslashes.
#
#   Linux/server values shown; laptop: D:/data/landing and D:/data/scratch.
# ------------------------------------------------------------------------------
paths:
  landing_root: /Users/mbp/Workspace/Developer/pipeline/data/staging
  scratch_root: /Users/mbp/Workspace/Developer/pipeline/data/scratch

  # NEW: manifest archive root. The extractor writes one manifest per
  # folder per run here: <runs_root>/<date>/<folder>/_manifest_<run_id>.json
  # (layout mirrors landing data). Omitted -> derived as <landing_root>/_runs.
  # Retention pruning only removes date-named directories, so _runs/ (and
  # _history/) survive alongside the landing date-dirs - protected by a
  # smoke test in lib/common.py.
  runs_root: /Users/mbp/Workspace/Developer/pipeline/data/staging/_runs

  # SQLite history DB. Path rules: must NOT sit inside a landing data
  # directory (date-named dir under landing_root). Default shown.
  history_db: /Users/mbp/Workspace/Developer/pipeline/data/staging/_history/dpl_history.db
# ------------------------------------------------------------------------------
# DUCKDB SESSION (per-table, in-memory, spills to scratch)
#
#   memory_limit : REQUIRED. Hard cap on DuckDB's buffer usage per table
#                  write. Beyond it, DuckDB pages to scratch_root - graceful
#                  degradation, not a crash. Budget guidance from a 32GB
#                  laptop: leave ~50% for the OS and other processes;
#                  ~10GB DuckDB + ~4GB Polars/batches fits comfortably.
#
#   threads      : OPTIONAL (schema default: omitted -> all cores).
#                  Sets DuckDB's parallelism for scans/aggregations/
#                  compression. Cap it (e.g. 4) when the write competes with
#                  interactive work or when concurrent extractors run.
#                  Integer > 0.
# ------------------------------------------------------------------------------
duckdb:
  memory_limit: 16GB
  threads: 1

# ------------------------------------------------------------------------------
# WRITER (Parquet output)
#
#   compression           : one of zstd | snappy (validated against
#                           VALID_COMPRESSIONS in lib/common.py).
#                           zstd = best size/speed balance for columnar data.
#                           snappy = faster writes, larger files.
#
#   compression_level     : codec level for zstd, 1 (fastest, largest) to 22 
#                           (slowest, smallest); default 3.
#
#   max_file_mb           : split threshold. A table whose single staged
#                           write measures ABOVE this is rewritten as
#                           {table}-0001.parquet, {table}-0002.parquet, ...
#                           parts (target ~90% of the threshold, actual sizes
#                           vary with compressibility). At or below: single
#                           {table}-0001.parquet part. Uniform numbering
#                           either way. Optional key (schema default: 512).
#                           Tune DOWN (e.g. 256) if downstream tools
#                           struggle with large files; UP if part counts get
#                           excessive.
#
#   keep_scratch_on_success : true retains the temp directory (staged parts,
#                           DuckDB spill) after a successful publish, for
#                           post-mortem debugging. Stale tmp_* directories
#                           are swept by clean_scratch on subsequent runs.
#                           Leave false in production - scratch is not
#                           retention storage.
# ------------------------------------------------------------------------------
writer:
  compression: zstd
  compression_level: 3
  max_file_mb: 1024
  keep_scratch_on_success: false
